name: Apply Veilforged Upgrade

on:
  push:
    paths:
      - '.github/workflows/veilforged-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild and verify upgrade patch
        shell: bash
        run: |
          set -euo pipefail
          cat upgrade/veilforged-patch-*.b64 | tr -d '\n\r ' | base64 --decode | gzip -dc > /tmp/veilforged.patch
          git apply --check /tmp/veilforged.patch
          git apply /tmp/veilforged.patch

      - name: Refresh PWA metadata
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text())
          manifest['name'] = 'Emberfall: Veilforged Edition'
          manifest['short_name'] = 'Emberfall'
          manifest['description'] = 'An original cinematic dark-fantasy party RPG with world tiers, Nemesis enemies, tactical parries, executions, runestones, companions, loot and a long campaign.'
          manifest['theme_color'] = '#08090d'
          manifest['background_color'] = '#050609'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text()
          sw = sw.replace("emberfall-eclipse-roads-v1", "emberfall-veilforged-v7")
          sw = sw.replace("emberfall-ascendant-v1", "emberfall-veilforged-v7")
          sw_path.write_text(sw)

      - name: Add Veilforged release notes
        shell: bash
        run: |
          cat > VEILFORGED_EDITION.md <<'EOF'
          # Emberfall — Veilforged Edition

          Veilforged pushes Emberfall toward a modern cinematic party-RPG and dark loot-driven action-RPG feel while keeping the world, art direction, names and systems original.

          ## Gameplay upgrades
          - Four World Tiers: Explorer, Adventurer, Veteran and Nightmare.
          - World Tier scales enemy health, attack, armor, elite frequency and rewards.
          - Nemesis enemies can spawn with multiple elite traits and improved rewards.
          - Timed Parry action with partial and Perfect Parry outcomes.
          - Execution action for wounded or heavily staggered enemies.
          - Eight equippable Runestones for physical, fire, arcane, radiant, poison, defense, momentum and loot builds.
          - Expanded Road Constellation with additional offense, survival, arcana and fortune passives.
          - Companion Bond progression through camp conversations, with stronger assists at higher bond ranks.
          - Mini-map support and richer character-sheet build information.
          - Existing stamina dodge, battlefield surfaces, weapon techniques, affixes, initiative, reactions, companions, boss phases and tactical positioning remain integrated.

          ## Presentation upgrades
          - Darker cinematic title and HUD treatment.
          - World Tier presentation and Nightmare styling.
          - Dedicated Parry and Execution combat actions.
          - Nemesis visual emphasis and stronger combat-state feedback.
          - Runestone equipment cards and upgraded build screen.
          - Compact minimap and enhanced mobile-responsive battle information.

          ## Compatibility
          - Save data from versions 3–6 is migrated into the version 7 state model.
          - GitHub Pages and PWA/offline support remain enabled.
          - No Windows executables, installers or scripts are introduced by this upgrade.
          EOF

      - name: Validate game
        shell: bash
        run: |
          set -euo pipefail
          node --check game.js
          node --check mobile.js
          node --check service-worker.js
          grep -q 'data-difficulty="nightmare"' index.html
          grep -q 'id="parryBtn"' index.html
          grep -q 'id="executeBtn"' index.html
          grep -q 'id="miniMap"' index.html
          grep -q 'const DIFFICULTIES' game.js
          grep -q 'const RUNESTONES' game.js
          grep -q 'function useParry' game.js
          grep -q 'function useExecution' game.js
          if find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) | grep -q .; then
            echo 'Forbidden executable or Windows script found.' >&2
            exit 1
          fi

      - name: Remove temporary patch payload
        shell: bash
        run: rm -rf upgrade

      - name: Commit Veilforged Edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Upgrade game to Veilforged Edition'
          git push origin main
