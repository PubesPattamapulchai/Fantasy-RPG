name: Publish Blackstar 2D v14

on:
  push:
    paths:
      - '.github/workflows/apply-blackstar-v14-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and persist v14 game patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          result=runpy.run_path('tools/apply-blackstar-v14.py')
          Path('game.js').write_text(result['s'],encoding='utf-8')
          PY
          git checkout HEAD -- .github/workflows/validate-2d.yml

      - name: Validate v14
        run: |
          node --check game.js
          node --check renderer2d-v14.js
          node --check combat-fx2d.js
          node --check actionrpg2d.js
          node --check cinematic2d-v13.js
          node --check mobile.js
          node --check service-worker.js
          python -m json.tool manifest.webmanifest >/dev/null
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(); g=Path('game.js').read_text(); sw=Path('service-worker.js').read_text(); r=Path('renderer2d-v14.js').read_text()
          assert 'renderer2d-v14.js' in h
          assert 'cinematic2d-v14.css' in h
          assert 'emberfall-blackstar-2d-v14' in sw
          assert 'INTERRUPTED!' in g and 'interruptNeed' in g
          assert 'counter-opening' in g
          assert 'setTimeout(enemyTurn,390)' in g
          assert 'legacy.style.opacity' in r
          runtime=(h+'\n'+sw+'\n'+r).lower()
          for token in ['three.min.js','modern3d.js','modern3d.css','emberfall3d','webglrenderer']:
              assert token not in runtime
          print('Validated Blackstar v14 game build')
          PY
          bad=$(find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print)
          test -z "$bad" || { echo "$bad"; exit 1; }

      - name: Commit game files only
        run: |
          rm -f tools/apply-blackstar-v14.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html service-worker.js manifest.webmanifest BLACKSTAR_2D_ASCENDANT_V14.md tools/apply-blackstar-v14.py
          git commit -m 'Fix blank world renderer and upgrade Emberfall 2D combat to v14'
          git push
