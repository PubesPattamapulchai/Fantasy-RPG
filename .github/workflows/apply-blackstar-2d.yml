name: Apply Blackstar 2D Reforged

on:
  push:
    paths:
      - 'tools/apply_blackstar_2d.py'
      - '.github/workflows/apply-blackstar-2d.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch runtime to modern 2D
        run: python3 tools/apply_blackstar_2d.py

      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check mobile.js
          node --check reforged-ui.js
          node --check renderer2d.js
          node --check combat-fx2d.js
          node --check actionrpg2d.js
          node --check service-worker.js

      - name: Validate 2D runtime wiring
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          html=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()
          json.loads(Path('manifest.webmanifest').read_text())
          for token in ['renderer2d.js','combat-fx2d.js','actionrpg2d.js','modern2d.css']:
              assert token in html, token
              assert token in sw or token == 'modern2d.css'
          for forbidden in ['three@','modern3d.js','modern3d.css','actionrpg-plus.js','actionrpg-plus.css']:
              assert forbidden not in html.lower(), forbidden
          assert 'emberfall-blackstar-2d-v12' in sw
          print('2D runtime wiring OK')
          PY

      - name: Executable safety scan
        run: |
          if find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print | grep -q .; then
            echo 'Prohibited executable/script payload found'
            exit 1
          fi
          echo 'Executable safety scan OK'

      - name: Commit 2D runtime conversion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Convert Emberfall runtime from 3D to modern layered 2D'
          git push
