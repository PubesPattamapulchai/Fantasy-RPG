name: Apply Blackstar 2D v15.1 Hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-v15-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v15.1 hotfix
        run: python tools/apply-v15-hotfix.py

      - name: Validate JavaScript and hotfix invariants
        run: |
          node --check game.js
          node --check renderer2d-v14.js
          node --check service-worker.js
          python - <<'PY'
          from pathlib import Path
          g=Path('game.js').read_text(encoding='utf-8')
          r=Path('renderer2d-v14.js').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          checks={
            'reset clears backup':'localStorage.removeItem(SAVE_BACKUP_KEY)' in g,
            'phase recovery queued':"enemy.intent='ultimate';enemy.nextIntent='brace'" in g,
            'queued ultimate guard':"previous==='ultimate'&&current==='ultimate'" in g,
            'queued mend guard':"previous==='mend'&&current==='mend'" in g,
            'v14 css compatibility':"'blackstar-v14','blackstar-v15'" in r,
            'cache v15.1':'emberfall-blackstar-2d-v15-1' in sw,
          }
          for name,ok in checks.items():
              print(name, 'OK' if ok else 'FAIL')
              assert ok,name
          print('Blackstar v15.1 regression hotfix validation OK')
          PY

      - name: Executable safety scan
        run: |
          bad=$(find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print)
          test -z "$bad" || { echo "$bad"; exit 1; }

      - name: Commit hotfix game files only
        run: |
          rm -f tools/apply-v15-hotfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js renderer2d-v14.js service-worker.js QUALITY_AUDIT_V15.md tools/apply-v15-hotfix.py
          git commit -m 'Fix Blackstar v15 save reset, boss recovery, and UI compatibility'
          git push
