name: Apply Blackstar 2D v14

on:
  push:
    paths:
      - '.github/workflows/apply-blackstar-v14.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v14 bugfix and gameplay upgrade
        run: python tools/apply-blackstar-v14.py

      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check renderer2d-v14.js
          node --check combat-fx2d.js
          node --check actionrpg2d.js
          node --check cinematic2d-v13.js
          node --check mobile.js
          node --check service-worker.js

      - name: Validate runtime wiring
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q 'renderer2d-v14.js' index.html
          grep -q 'cinematic2d-v14.css' index.html
          grep -q 'emberfall-blackstar-2d-v14' service-worker.js
          grep -q 'INTERRUPTED' game.js
          grep -q 'counter-opening' game.js
          if grep -Eqi 'three\.min\.js|modern3d\.js|modern3d\.css|Emberfall3D|WebGLRenderer' index.html renderer2d-v14.js service-worker.js; then
            echo '3D runtime reference detected'; exit 1
          fi

      - name: Executable safety scan
        run: |
          if find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print | grep -q .; then
            echo 'Prohibited executable or installer file found'; exit 1
          fi

      - name: Commit Blackstar v14
        run: |
          rm -f tools/apply-blackstar-v14.py .github/workflows/apply-blackstar-v14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix blank world renderer and upgrade Emberfall 2D action combat'
          git push
