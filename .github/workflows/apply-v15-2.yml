name: Apply Blackstar 2D v15.2

on:
  push:
    paths:
      - '.github/workflows/apply-v15-2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v15.2 patch
        run: python tools/apply-v15-2-world-ui.py

      - name: Validate JavaScript, CSS wiring, and map vocabulary
        run: |
          node --check game.js
          node --check renderer2d-v14.js
          node --check actionrpg2d.js
          node --check combat-fx2d.js
          node --check service-worker.js
          python - <<'PY'
          from pathlib import Path
          g=Path('game.js').read_text(encoding='utf-8')
          r=Path('renderer2d-v14.js').read_text(encoding='utf-8')
          css=Path('cinematic2d-v14.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          checks={
            'exit state bridge':'unlocked:state.questStage>=(e.minStage||0)' in g,
            'gear comparisons':'gearDeltaLabel' in g and 'weaponRangeHint' in g,
            'armor comparisons':'currentArmor=equippedArmor()' in g,
            'outdoor water semantics':"if(ch==='W')return solidWallBiome(s)?p.far" in r,
            'bridge terrain':"ch==='H'" in r,
            'lava terrain':"ch==='L'" in r,
            'chests visible':'drawChest2d' in r and 'locationData?.chests' in r,
            'nodes visible':'drawNode2d' in r and 'locationData?.nodes' in r,
            'shrines visible':'drawShrine2d' in r,
            'exits visible':'drawExit2d' in r,
            'comparison CSS':'v15.2 — comparison-first gear UX' in css,
            'cache v15.2':'emberfall-blackstar-2d-v15-2' in sw,
          }
          for name,ok in checks.items():
              print(name, 'OK' if ok else 'FAIL')
              assert ok,name
          runtime=(Path('index.html').read_text()+sw+r).lower()
          for token in ['three.min.js','modern3d.js','modern3d.css','emberfall3d','webglrenderer']:
              assert token not in runtime,token
          print('Blackstar v15.2 validation OK')
          PY

      - name: Executable safety scan
        run: |
          bad=$(find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print)
          test -z "$bad" || { echo "$bad"; exit 1; }

      - name: Commit v15.2 game files
        run: |
          rm -f tools/apply-v15-2-world-ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js renderer2d-v14.js cinematic2d-v14.css service-worker.js QUALITY_AUDIT_V15.md tools/apply-v15-2-world-ui.py
          git commit -m 'Improve Emberfall 2D world readability and gear comparison UX'
          git push
