name: Apply Blackstar Ascendant 3D Upgrade
on:
  push:
    paths:
      - '.github/workflows/blackstar-ascendant-3d.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch campaign engine and presentation
        run: python3 .ascendant/apply_upgrade.py
      - name: Validate browser game
        run: |
          node --check game.js
          node --check mobile.js
          node --check reforged-ui.js
          node --check modern3d.js
          grep -q 'window.EmberfallBridge' game.js
          grep -q 'modern3d.css' index.html
          grep -q 'modern3d.js' index.html
          grep -q 'three@0.160.0' index.html
          grep -q 'emberfall-ascendant-3d-v10' service-worker.js
          if find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) | grep -q .; then
            echo 'Unsafe executable/script file found'; exit 1
          fi
      - name: Commit upgraded edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf .ascendant .github/workflows/blackstar-ascendant-3d.yml
          git add index.html game.js service-worker.js manifest.webmanifest modern3d.js modern3d.css
          git commit -m 'Transform Emberfall into Blackstar Ascendant 3D Edition'
          git push origin main
