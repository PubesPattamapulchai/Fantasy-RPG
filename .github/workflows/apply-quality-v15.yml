name: Apply Blackstar 2D v15 Quality

on:
  push:
    paths:
      - '.github/workflows/apply-quality-v15.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v15 quality patch
        run: python tools/apply-quality-v15.py

      - name: Validate JavaScript and manifest
        run: |
          node --check game.js
          node --check renderer2d-v14.js
          node --check combat-fx2d.js
          node --check actionrpg2d.js
          node --check mobile.js
          node --check reforged-ui.js
          node --check service-worker.js
          python -m json.tool manifest.webmanifest >/dev/null

      - name: Validate root fixes and runtime wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          g=Path('game.js').read_text(encoding='utf-8')
          r=Path('renderer2d-v14.js').read_text(encoding='utf-8')
          a=Path('actionrpg2d.js').read_text(encoding='utf-8')
          c=Path('combat-fx2d.js').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          checks={
            'v15 title':'Blackstar 2D Ascendant v15' in h,
            'duplicate cinematic JS removed':'cinematic2d-v13.js' not in h and 'cinematic2d-v13.js' not in sw,
            'v15 cache':'emberfall-blackstar-2d-v15' in sw,
            'bridge temporary lock state':'battleLocked: !!state.battleLocked' in g and 'timingActive: !!state.timingActive' in g,
            'bridge clickable objects':'chests:' in g and 'nodes:' in g,
            'legacy render throttle':'lastLegacyMapFrame' in g and 'now-lastLegacyMapFrame>=250' in g,
            'hidden menu optimization':"if(!ui.gear.classList.contains('hidden'))renderGear()" in g,
            'safe save backup':'SAVE_BACKUP_KEY' in g and 'version:11' in g and '[3,4,5,6,7,8,9,10,11]' in g,
            'accepted-only action events':'const commitAction=' in g,
            'enemy archetypes':"['mage','wraith'].includes(archetype)" in g and "['golem','knight','guard'].includes(archetype)" in g,
            'boss recovery window':"enemy.intent==='ultimate'&&next==='ultimate'" in g,
            'blocked terrain before goal':a.index('if(blockedTiles.has(map[y][x]))return false') < a.index('if(goal&&goal.x===x&&goal.y===y)return true'),
            'buffer temporary lock only':'s.battleLocked||s.timingActive' in a,
            'exact click projection':'tileToScreen' in a and 'tileToScreen:' in r,
            'particle real dt':'function drawBattle(s,dt,time)' in r and 'drawParticles(.016)' not in r,
            'particle cap':'MAX_PARTICLES=180' in r,
            'sticky renderer fallback':"document.body.classList.remove('modern2d-active')" in r,
            'event-driven combat UI':'flowSurgeChip' in c and 'reactionBanner2d' in c and 'requestAnimationFrame(inspect)' not in c,
            'quality audit notes':Path('QUALITY_AUDIT_V15.md').exists(),
          }
          for name,ok in checks.items():
              print(f'{name}:', 'OK' if ok else 'FAIL')
              assert ok,name
          runtime=(h+'\n'+sw+'\n'+r).lower()
          for token in ['three.min.js','modern3d.js','modern3d.css','emberfall3d','webglrenderer']:
              assert token not in runtime, f'3D runtime reference: {token}'
          print('Blackstar 2D v15 root-fix validation OK')
          PY

      - name: Executable safety scan
        run: |
          bad=$(find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.msi' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print)
          test -z "$bad" || { echo "$bad"; exit 1; }
          echo 'No prohibited executable payloads found'

      - name: Commit v15 game files
        run: |
          rm -f tools/apply-quality-v15.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js renderer2d-v14.js actionrpg2d.js combat-fx2d.js index.html service-worker.js manifest.webmanifest QUALITY_AUDIT_V15.md tools/apply-quality-v15.py
          git commit -m 'Stabilize and upgrade Emberfall Blackstar 2D to v15'
          git push
